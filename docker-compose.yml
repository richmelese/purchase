# Browser ──► frontend (Next.js UI + BFF, :3000) ──► backend (NestJS API, private) ──► SQLite (./data)
#
#   cp .env.example .env      # then set BFF_SHARED_SECRET
#   docker compose up -d --build
services:
  backend:
    build: ./purchase-backend
    container_name: purchase-backend
    restart: unless-stopped
    # No published ports: only the frontend can reach the API.
    expose:
      - "5000"
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/psm.db
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?Set BFF_SHARED_SECRET in .env (see .env.example)}
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: purchase-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      BACKEND_URL: http://backend:5000
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?Set BFF_SHARED_SECRET in .env (see .env.example)}
    depends_on:
      backend:
        condition: service_healthy
